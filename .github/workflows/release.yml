name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep in sync with .mise.toml.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "26.10.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: make ci-check

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "26.10.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: make release-local
      - uses: actions/upload-artifact@v5
        with:
          name: tasks-pending-linux-x86_64
          path: |
            dist/tasks-pending.tar.gz
            dist/tasks-pending.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release notes
        run: |
          {
            echo "## Artifacts"
            echo
            echo "- tasks-pending.tar.gz"
            echo
            echo "## Checksums"
            echo '```'
            cat artifacts/*.sha256
            echo '```'
          } > body.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" artifacts/*.tar.gz artifacts/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file body.md
