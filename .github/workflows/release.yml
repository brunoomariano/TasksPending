name: Release

# Every master push verifies the release artifacts. A tag `v<version>`
# matching Cargo.toml publishes the Linux bundle, the Arch package, the
# installer and checksums.
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but do not publish a release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read the version and check the tag
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          # A manual run that publishes must build the commit the tag names:
          # the release is created from that tag, so its assets must come
          # from it, not from whatever the branch holds now.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DRY_RUN" == false ]]; then
            git fetch --no-tags --depth=1 origin "+refs/tags/v$version:refs/tags/v$version" || {
              echo "::error::push the tag v$version before publishing"
              exit 1
            }
            tagged="$(git rev-parse "refs/tags/v$version^{commit}")"
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "::error::tag v$version is $tagged, not the commit being built ($GITHUB_SHA); run the workflow from the tag"
              exit 1
            fi
          fi
          grep -q "^## $version\$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          }
          # The package version follows the workspace.
          grep -q "^pkgver=$version\$" packaging/arch/PKGBUILD || {
            echo "::error::packaging/arch/PKGBUILD pkgver is not $version"
            exit 1
          }

      - name: Install the GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      # Keep in sync with .mise.toml.
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: make ci-check

  build:
    needs: quality
    timeout-minutes: 30
    # The Linux binary needs the glibc of the runner or newer (2.39), and
    # the GTK of Ubuntu 24.04 or newer (4.14, libadwaita 1.5).
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ env.TARGET }}
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p tasks-pending
      - name: Package
        env:
          SKIP_BUILD: "1"
        run: ./scripts/release-local.sh
      - name: Smoke test
        run: ./scripts/test-release-bundle.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bundle-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  arch:
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pinned by digest: the package is built in it, so what it holds is
    # part of the release. Move the digest on purpose, not by a rebuild.
    container: archlinux:base-devel@sha256:624bdc7fc6615155d67bc34cf7146c0c9fd0e3c92943977da63a630e4ca49c30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: bundle-x86_64-unknown-linux-gnu
          path: pkg
      - name: Build the package
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          cp packaging/arch/PKGBUILD pkg/
          cd pkg
          sum="$(cut -d' ' -f1 "tasks-pending-$VERSION-x86_64-unknown-linux-gnu.tar.gz.sha256")"
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" \
                 -e "s/^sha256sums=.*/sha256sums=('$sum')/" PKGBUILD
          useradd -m builder
          chown -R builder: .
          # The bundle is already next to PKGBUILD, so makepkg does not download it.
          su builder -c "makepkg --noconfirm --nodeps -f"
          ls -l ./*.pkg.tar.zst
          # The package installs with its dependencies and its executable runs.
          pacman -Syu --noconfirm
          pacman -U --noconfirm ./*.pkg.tar.zst
          tasks-pending --help >/dev/null
          tasks-pending serve --help >/dev/null
          tasks-pending app --help >/dev/null
          test "$(pacman -Qlq tasks-pending-bin | grep -c '^/usr/bin/.')" -eq 1
          test -f /usr/lib/systemd/user/tasks-pending.service
          test -f /usr/share/applications/io.github.brunoomariano.TasksPending.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.brunoomariano.TasksPending.svg
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: arch-package
          path: |
            pkg/*.pkg.tar.zst
            pkg/PKGBUILD

  release:
    needs: [quality, build, arch]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare stable install assets
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: ./scripts/prepare-release-assets.sh "$VERSION" artifacts
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          {
            awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md
            echo
            echo "## Install"
            echo
            echo "- Install or update in one command (Linux x86_64; on Arch it installs the package):"
            echo
            echo '  ```sh'
            echo "  curl --proto '=https' --tlsv1.2 -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/tasks-pending-install.sh | sh"
            echo '  ```'
            echo
            echo "- The installer checks every download against its published checksum, then runs \`tasks-pending setup\`: the desktop entry, the user service and the daemon."
            echo "- Already installed? \`tasks-pending upgrade\` fetches this release the same way."
            echo "- Then follow [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/install.md) to configure sources and tokens."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat artifacts/SHA256SUMS
            echo '```'
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256 \
            artifacts/*.pkg.tar.zst artifacts/*.pkg.tar.zst.sha256 \
            artifacts/PKGBUILD artifacts/SHA256SUMS \
            artifacts/tasks-pending-install.sh artifacts/tasks-pending-install.sh.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "TasksPending $VERSION" \
            --notes-file notes.md \
            --verify-tag
