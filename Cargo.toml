[workspace]
members = [
    "crates/pending-api",
    "crates/pending-app",
    "crates/pending-client",
    "crates/pending-core",
    "crates/pending-github",
    "crates/pending-gitlab",
    "crates/pending-google",
    "crates/pending-http",
    "crates/pending-ical",
    "crates/pending-jira",
    "crates/pending-linear",
    "crates/pending-plane",
    "crates/pending-runtime",
    "crates/pending-todoist",
    "crates/tasks-pending",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/brunoomariano/TasksPending"
homepage = "https://github.com/brunoomariano/TasksPending"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
