# TasksPending config. Copy to ~/.config/tasks-pending/config.toml
# (or $XDG_CONFIG_HOME/tasks-pending/config.toml), or point
# TASKS_PENDING_CONFIG / --config at it. Tokens and secret URLs never go here.

# Default wait between refreshes of a source, in seconds.
refresh_seconds = 300
# A refresh slower than this counts as a failure; sources may override it.
timeout_seconds = 60

# The page follows this file's order:
#   - each [[sources]] is a group; groups run left to right in the order
#     below, whatever their board;
#   - each [[sources.stacks]] is a stack of cards inside its group; stacks
#     run top to bottom in the order they are listed.
# Any stack may add `enabled = false` to switch it off without deleting it
# (not queried, not shown anywhere).
# Any stack may add `sort = "oldest"` to list the least recently updated
# cards first (default "newest"); severity and due time still come first.
# Any stack may add `exclude = ["pattern", ...]` to leave out the cards whose
# title or body matches a pattern (regular expressions, compared without
# case; write a backslash twice). Other stacks keep those cards.
# To reorder, move whole blocks up or down. Without [[sources.stacks]] a
# source uses its default stacks.
[[sources]]
name = "sample"      # shown in source health; must be unique
kind = "sample"      # built-in fixed cards
board = "Inbox"      # area used by the web filter and TUI tabs (default "Inbox")
enabled = true
# refresh_seconds = 60   # overrides the default above
# timeout_seconds = 120  # overrides the default timeout above
# Every provider shows its Dashboard Icons logo by default. Set `icon` to
# override it; use `icon_dark` for a dark-theme variant.
# Dashboard Icons: https://dashboardicons.com
# icon = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/github.svg"
# icon_dark = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/github-light.svg"

# --- Examples (uncomment and adapt) ---------------------------------------

# GitHub: every stack is a search query (github.com search syntax).
# Token from GITHUB_TOKEN, then GH_TOKEN, then `gh auth token`.
# Without stacks, the source uses the first five below plus "Assigned issues":
# your pull requests split by what to do next.
# [[sources]]
# name = "github"
# kind = "github"
# board = "Work"
#
#   [[sources.stacks]]
#   name = "Review requested"
#   query = "is:open is:pr archived:false review-requested:@me"
#   # One organization only: add `org:` to any of these queries.
#   # query = "is:open is:pr archived:false org:acme review-requested:@me"
#   severity = "warning"          # optional: info (default), warning, critical
#   # Hide bot noise, a repository, or a word in the title:
#   exclude = ["dependabot\\[bot\\]", "^chore\\(deps\\)", "^acme/legacy#", "\\bwip\\b"]
#
#   [[sources.stacks]]
#   name = "Returned to you"      # a reviewer asked for changes
#   query = "is:open is:pr archived:false author:@me draft:false review:changes_requested"
#   severity = "warning"
#
#   [[sources.stacks]]
#   name = "Ready to merge"       # approved
#   query = "is:open is:pr archived:false author:@me draft:false review:approved"
#
#   [[sources.stacks]]
#   name = "Not approved yet"     # neither approved nor returned
#   query = "is:open is:pr archived:false author:@me draft:false -review:approved -review:changes_requested"
#   sort = "oldest"               # stale ones first (default "newest")
#
#   [[sources.stacks]]
#   name = "Drafts"
#   query = "is:open is:pr archived:false author:@me draft:true"
#
#   [[sources.stacks]]
#   name = "Notifications"
#   notifications = "unread"      # "all" adds read ones (incl. marked done)
#
#   [[sources.stacks]]
#   name = "Security"
#   alerts = ["acme/api", "acme/web"]   # open Dependabot, secret and code scanning alerts

# GitLab: every stack is your open merge requests, your open issues or your
# pending to-do items. Needs GITLAB_TOKEN (personal access token with the
# read_api scope); GITLAB_BASE_URL for a self-managed instance.
# [[sources]]
# name = "gitlab"
# kind = "gitlab"
# board = "Work"
#
#   [[sources.stacks]]
#   name = "Review requested"
#   merge_requests = "review_requested"   # review_requested | assigned | authored
#   draft = false                 # optional: only non-drafts (true: only drafts)
#
#   [[sources.stacks]]
#   name = "Platform bugs"
#   issues = "assigned"           # assigned | authored
#   group = "acme/platform"       # optional: a group with its subgroups,
#                                 # or project = "acme/api" (not both)
#   labels = ["bug"]              # optional: items with every label
#   severity = "warning"          # optional: info, warning, critical
#
#   [[sources.stacks]]
#   name = "To-dos"
#   todos = true

# Plane: every stack filters the workspace's work items locally.
# Needs PLANE_BASE_URL, PLANE_WORKSPACE_SLUG (or PLANE_WORKSPACE) and
# PLANE_API_KEY (or PLANE_TOKEN) in the environment.
# [[sources]]
# name = "plane"
# kind = "plane"
# board = "Work"
# timeout_seconds = 180   # one request at a time: slow on big workspaces
#
#   [[sources.stacks]]
#   name = "Assigned to me"       # assignee defaults to "me", open states
#
#   [[sources.stacks]]
#   name = "Inbox, unassigned"
#   assignee = "none"             # me | none | others | any
#   state = ["Inbox"]             # state names, case-insensitive
#
#   [[sources.stacks]]
#   name = "In review (others)"
#   assignee = "others"
#   state = ["In Review"]
#   # also: state_group = ["started"], project = ["API"], priority = ["urgent"]

# Google Calendar through GNOME Online Accounts: install gnome-online-accounts
# and gnome-online-accounts-gtk, add the Google account with Calendar enabled.
# No token or URL here or in the environment.
# [[sources]]
# name = "agenda"
# kind = "google"
# board = "Personal"
#
#   [[sources.stacks]]
#   name = "Today"
#   when = ["now", "today"]
#
#   [[sources.stacks]]
#   name = "Team"
#   calendar = ["Team"]            # calendar names as shown in Google Calendar

# Calendar (any iCal feed; for Google Calendar the "secret address in iCal
# format"). Needs TASKS_PENDING_ICAL_URL; that URL is a secret.
# [[sources]]
# name = "calendar"
# kind = "ical"
# board = "Personal"
#
#   [[sources.stacks]]
#   name = "Today"
#   when = ["now", "today"]       # now | today | tomorrow | later
#
#   [[sources.stacks]]
#   name = "Coming up"
#   when = ["tomorrow", "later"]

# Todoist: every stack is a Todoist filter query.
# Needs TODOIST_API_TOKEN (Todoist Settings → Integrations → Developer).
# [[sources]]
# name = "todoist"
# kind = "todoist"
# board = "Personal"
#
#   [[sources.stacks]]
#   name = "Today"
#   filter = "today | overdue"
#
#   [[sources.stacks]]
#   name = "Next 7 days"
#   filter = "7 days & !today & !overdue"
