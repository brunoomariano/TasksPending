[workspace]
members = [
    "crates/pending-api",
    "crates/pending-core",
    "crates/pending-github",
    "crates/pending-google",
    "crates/pending-http",
    "crates/pending-ical",
    "crates/pending-plane",
    "crates/pending-runtime",
    "crates/pending-todoist",
    "crates/pending-tui",
    "crates/tasks-pending",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/brunoomariano/TasksPending"
homepage = "https://github.com/brunoomariano/TasksPending"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["chrono-impl"] }
